<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstração — Portal da Reforma Tributária | Sankhya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F4F9F5;
    --ink:#12211A;
    --ink-soft:#4E5F56;
    --muted:#7C8B82;
    --green:#66CC66;
    --green-deep:#1F6B3E;
    --green-dark:#12331F;
    --green-pale:#E4F5E7;
    --line: rgba(18,33,26,0.10);
    --line-strong: rgba(18,33,26,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-soft);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    letter-spacing:-0.015em;
    color:var(--green-dark);
  }
  .wrap{ max-width:920px; margin:0 auto; padding:0 24px; }
  a{ color:inherit; }

  header.top{
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  header.top .wrap{ display:flex; align-items:center; justify-content:space-between; height:72px; }
  .brand img{ width:118px; height:auto; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:14px; font-weight:600; color:var(--ink-soft); text-decoration:none;
  }
  .back-link:hover{ color:var(--green-deep); }

  main{ padding:44px 0 80px; }

  .page-head{ max-width:640px; }
  .page-head .pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 14px; border-radius:100px;
    background:var(--green-pale); color:var(--green-deep);
    font-size:13px; font-weight:600;
  }
  .page-head .pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); }
  .page-head h1{ margin-top:16px; font-size:30px; }
  .page-head p{ margin-top:12px; color:var(--ink-soft); font-size:15.5px; }

  /* TABS */
  .tabs{
    margin-top:36px; display:flex; gap:6px;
    background:var(--bg-soft); border:1px solid var(--line-strong);
    border-radius:14px; padding:6px;
  }
  .tab{
    flex:1; padding:13px 20px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Manrope',sans-serif; font-size:15px; font-weight:700; color:var(--muted);
    background:transparent; text-align:center;
    transition: color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tab.active{
    color:var(--green-deep); background:#fff;
    box-shadow:0 2px 8px rgba(18,33,26,0.12);
  }
  .tab:not(.active):hover{ color:var(--ink); background:rgba(255,255,255,0.55); }

  /* PHASE BUTTONS (Antes / Depois) */
  .phases{ margin-top:20px; display:flex; gap:10px; }
  .phase-btn{
    padding:9px 20px; border-radius:100px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700;
    border:1.5px solid var(--line-strong); background:#fff; color:var(--ink-soft);
    transition: all .15s ease;
  }
  .phase-btn.active.phase-antes{ background:rgba(18,33,26,0.07); border-color:rgba(18,33,26,0.35); color:var(--ink); }
  .phase-btn.active.phase-depois{ background:var(--green-pale); border-color:var(--green-deep); color:var(--green-deep); }
  .phase-btn:not(.active):hover{ border-color:var(--green-deep); }

  .tab-note{
    margin-top:16px;
    color:var(--ink-soft); font-size:14.5px; line-height:1.6;
  }
  .tab-note strong{ font-weight:700; color:var(--ink); }

  /* CAROUSEL CARD */
  .stage-card{
    margin-top:28px; background:#fff; border:1px solid var(--line-strong); border-radius:16px;
    overflow:hidden;
  }
  .stage{ position:relative; width:100%; aspect-ratio:16/9; background:var(--bg-soft); overflow:hidden; }
  .stage-viewport{ position:absolute; inset:0; overflow:hidden; }
  .stage-track{
    display:flex; height:100%;
    transition: transform .5s cubic-bezier(.4,0,.2,1);
  }
  .stage-slide{ position:relative; flex-shrink:0; height:100%; }
  .stage-slide img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .stage-placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding:32px;
    background:linear-gradient(135deg, var(--green-pale), var(--bg-soft));
  }
  .stage-placeholder .sp-icon{ font-size:30px; }
  .stage-placeholder p{ color:var(--green-deep); font-weight:600; font-size:15px; }
  .stage-placeholder span{ color:var(--muted); font-size:13px; }

  .stage-tags{ position:absolute; top:16px; left:16px; z-index:2; display:flex; gap:8px; }
  .stage-counter{
    position:absolute; top:16px; right:16px; z-index:2;
    padding:6px 12px; border-radius:100px; font-size:12.5px; font-weight:700;
    background:rgba(18,33,26,0.55); color:#fff; font-family:'Manrope',sans-serif;
    letter-spacing:0.02em;
  }
  .stage-tag{
    padding:6px 13px; border-radius:100px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,0.92); color:var(--ink-soft);
  }
  .stage-tag.phase-antes{ color:#8a6a1f; background:#FFF3D6; }
  .stage-tag.phase-depois{ color:var(--green-deep); background:var(--green-pale); }

  .stage-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.92); color:var(--green-dark); font-size:19px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(18,33,26,0.15);
    transition: background .15s ease;
  }
  .stage-arrow:hover{ background:#fff; }
  .stage-arrow.prev{ left:16px; }
  .stage-arrow.next{ right:16px; }

  .stage-footer{ padding:22px 26px; }
  .stage-footer h4{ font-family:'Manrope',sans-serif; font-weight:700; font-size:18px; color:var(--green-dark); }
  .stage-footer p{ margin-top:6px; font-size:14.5px; color:var(--ink-soft); }
  .stage-dots{ margin-top:16px; display:flex; gap:8px; }
  .stage-dot{
    width:8px; height:8px; border-radius:50%; background:var(--line-strong); border:none; cursor:pointer; padding:0;
    transition: background .15s ease, transform .15s ease;
  }
  .stage-dot.active{ background:var(--green-deep); transform:scale(1.25); }

  .cta-row{ margin-top:40px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 24px; border-radius:8px;
    font-size:14.5px; font-weight:600; text-decoration:none;
    border:1.5px solid transparent;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn-primary{ background:var(--green-deep); color:#fff; }
  .btn-primary:hover{ background:#175534; transform:translateY(-1px); }
  .btn-ghost{ border-color:var(--line-strong); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--green-deep); }

  @media (max-width:640px){
    .wrap{ padding:0 18px; }
    .page-head h1{ font-size:24px; }
    .stage-footer{ padding:18px; }
  }
</style>
</head>

<script>
  // =========================================================================
  // IMAGENS: cada funcionalidade tem uma fase "antes" e uma fase "depois",
  // e cada fase pode ter quantas imagens você for mandando (não precisa ser
  // uma só). Suba os arquivos na mesma pasta deste HTML (ex: numa pasta /img)
  // e ajuste os caminhos abaixo. Enquanto um caminho não existir, aparece um
  // espaço reservado no lugar dele.
  // =========================================================================
  const CAROUSELS = {
    configuracao: {
      label: 'Configuração',
      title: 'Configuração de Nota de Débito',
      note: 'Nosso assistente resolve em poucas etapas o que hoje é feito em <strong>3 telas diferentes</strong>, de forma manual.',
      phases: {
        antes: [
          { img: 'img/config-antes-1.png', desc: 'Criação manual do Tipo de Operação (TOP), campo a campo, direto na tela de cadastro.' },
          { img: 'img/config-antes-2.png', desc: 'Cadastro manual da alíquota de CBS, com todos os parâmetros técnicos preenchidos à mão.' },
          { img: 'img/config-antes-3.png', desc: 'Cadastro manual da alíquota de IBS, repetindo o mesmo processo técnico.' },
        ],
        depois: [
          { img: 'img/config-depois-1.png', desc: 'Dashboard: um subtipo ainda sem TOP configurada, pronto para iniciar o assistente.' },
          { img: 'img/config-depois-2.png', desc: 'Assistente pergunta se já existe uma TOP no ERP para vincular ou se deve criar uma nova.' },
          { img: 'img/config-depois-3.png', desc: 'Etapa final do assistente: resumo completo antes de confirmar o cadastro.' },
          { img: 'img/config-depois-4.png', desc: 'TOP cadastrada com sucesso, já disponível para gerar Notas de Débito automaticamente.' },
          { img: 'img/config-depois-5.png', desc: 'Dashboard atualizado: os dois subtipos configurados, prontos para uso.' },
        ],
      },
    },
    emissao: {
      label: 'Emissão',
      title: 'Emissão de Multa e Juros',
      note: 'A automação faz o cálculo de rateio de multa e juros proporcional para cada item da nota, gera a nota com base no que foi configurado no assistente e fica pronta para transmissão no Portal de Vendas — manualmente ou via agendamento do próprio portal.',
      phases: {
        antes: [
          { img: 'img/emissao-antes-1.png', desc: 'No Portal de Vendas, localizar a nota de origem e iniciar manualmente a emissão da Nota de Débito.' },
          { img: 'img/emissao-antes-2.png', desc: 'Selecionar a TOP e os itens pendentes de cobrança para gerar a nota manualmente.' },
          { img: 'img/emissao-antes-3.png', desc: 'Cálculo do rateio de multa e juros feito à parte, numa planilha.' },
          { img: 'img/emissao-antes-4.png', desc: 'Inserir manualmente o valor rateado em cada item, na Central de Vendas.' },
        ],
        depois: [
          { img: 'img/emissao-depois-1.png', desc: 'Portal da Reforma Tributária: Receitas › Multa e Juros já mapeado e monitorado.' },
          { img: 'img/emissao-depois-2.png', desc: 'O sistema identifica sozinho os títulos com multa e juros pendentes de nota.' },
          { img: 'img/emissao-depois-3.png', desc: 'Detalhamento mostra a nota de débito já emitida automaticamente, vinculada ao documento de origem.' },
          { img: 'img/emissao-depois-4.png', desc: 'Nota de débito gerada e disponível para transmissão no Portal de Vendas, sem intervenção manual.' },
        ],
      },
    },
  };

  const PHASE_LABELS = { antes: 'Antes', depois: 'Depois' };

  const tabsEl = document.getElementById('tabs');
  const phasesEl = document.getElementById('phases');
  const tabNoteEl = document.getElementById('tabNote');
  const stageEl = document.getElementById('stage');
  const stageTitleEl = document.getElementById('stageTitle');
  const stageDescEl = document.getElementById('stageDesc');
  const stageDotsEl = document.getElementById('stageDots');

  // Lê a aba inicial pela URL: demonstracao.html?aba=emissao
  const params = new URLSearchParams(window.location.search);
  let currentTab = params.get('aba') && CAROUSELS[params.get('aba')] ? params.get('aba') : 'configuracao';
  let currentPhase = 'antes';
  let currentSlide = 0;

  function renderTabs(){
    tabsEl.innerHTML = Object.keys(CAROUSELS).map((key) =>
      '<button class="tab' + (key === currentTab ? ' active' : '') + '" onclick="switchTab(\'' + key + '\')" type="button">' + CAROUSELS[key].label + '</button>'
    ).join('');
  }

  function renderPhases(){
    const group = CAROUSELS[currentTab];
    phasesEl.innerHTML = Object.keys(group.phases).map((phase) =>
      '<button class="phase-btn phase-' + phase + (phase === currentPhase ? ' active' : '') + '" onclick="switchPhase(\'' + phase + '\')" type="button">' + PHASE_LABELS[phase] + '</button>'
    ).join('');
  }

  function renderNote(){
    tabNoteEl.innerHTML = CAROUSELS[currentTab].note || '';
  }

  // Reconstrói a trilha inteira (chamado ao trocar de aba ou de fase)
  function renderStage(){
    const group = CAROUSELS[currentTab];
    const list = group.phases[currentPhase];
    const slideWidth = 100 / list.length;

    stageEl.innerHTML =
      '<div class="stage-counter" id="stageCounter">' + (currentSlide + 1) + '/' + list.length + '</div>' +
      (list.length > 1
        ? '<button class="stage-arrow prev" onclick="prevSlide()" aria-label="Anterior" type="button">‹</button><button class="stage-arrow next" onclick="nextSlide()" aria-label="Próximo" type="button">›</button>'
        : '') +
      '<div class="stage-viewport"><div class="stage-track" id="stageTrack" style="width:' + (list.length * 100) + '%"></div></div>';

    const track = document.getElementById('stageTrack');
    list.forEach((s) => {
      const slide = document.createElement('div');
      slide.className = 'stage-slide';
      slide.style.width = slideWidth + '%';

      const img = document.createElement('img');
      img.src = s.img;
      img.alt = group.title + ' — ' + PHASE_LABELS[currentPhase];
      img.onerror = function(){
        img.remove();
        const ph = document.createElement('div');
        ph.className = 'stage-placeholder';
        ph.innerHTML = '<div class="sp-icon">🖼️</div><p>Print em preparação</p><span>' + s.img + '</span>';
        slide.appendChild(ph);
      };
      slide.appendChild(img);
      track.appendChild(slide);
    });

    updateSlidePosition(false);
  }

  // Só desloca a trilha e atualiza textos/contador (chamado ao navegar dentro da mesma fase)
  function updateSlidePosition(animate){
    const group = CAROUSELS[currentTab];
    const list = group.phases[currentPhase];
    const s = list[currentSlide];
    const track = document.getElementById('stageTrack');
    const counter = document.getElementById('stageCounter');

    if (track){
      track.style.transition = animate === false ? 'none' : '';
      track.style.transform = 'translateX(-' + (currentSlide * (100 / list.length)) + '%)';
      if (animate === false){
        // força reflow para o "none" ser aplicado antes de voltar a permitir transição
        void track.offsetHeight;
        track.style.transition = '';
      }
    }
    if (counter) counter.textContent = (currentSlide + 1) + '/' + list.length;

    stageTitleEl.textContent = group.title;
    stageDescEl.textContent = s.desc || '';

    stageDotsEl.innerHTML = list.map((_, i) =>
      '<button class="stage-dot' + (i === currentSlide ? ' active' : '') + '" onclick="goToSlide(' + i + ')" aria-label="Slide ' + (i+1) + '" type="button"></button>'
    ).join('');
  }

  function switchTab(key){
    currentTab = key;
    currentPhase = 'antes';
    currentSlide = 0;
    try {
      const url = new URL(window.location);
      url.searchParams.set('aba', key);
      window.history.replaceState({}, '', url);
    } catch (e) {
      // Alguns ambientes (ex: pré-visualização em iframe sandbox) bloqueiam
      // a troca de URL. A navegação por abas continua funcionando normalmente.
    }
    renderTabs();
    renderPhases();
    renderNote();
    renderStage();
    restartAutoplay();
  }

  function switchPhase(phase){
    currentPhase = phase;
    currentSlide = 0;
    renderPhases();
    renderStage();
    restartAutoplay();
  }

  function nextSlide(){
    const n = CAROUSELS[currentTab].phases[currentPhase].length;
    currentSlide = (currentSlide + 1) % n;
    updateSlidePosition(true);
  }
  function prevSlide(){
    const n = CAROUSELS[currentTab].phases[currentPhase].length;
    currentSlide = (currentSlide - 1 + n) % n;
    updateSlidePosition(true);
  }
  function goToSlide(i){ currentSlide = i; updateSlidePosition(true); restartAutoplay(); }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { nextSlide(); restartAutoplay(); }
    if (e.key === 'ArrowLeft') { prevSlide(); restartAutoplay(); }
  });

  // ---- Autoplay: avança sozinho a cada 2s, deslizando suavemente; pausa no hover ----
  const AUTOPLAY_MS = 2000;
  let autoplayTimer = null;

  function startAutoplay(){
    stopAutoplay();
    autoplayTimer = setInterval(nextSlide, AUTOPLAY_MS);
  }
  function stopAutoplay(){
    if (autoplayTimer) clearInterval(autoplayTimer);
    autoplayTimer = null;
  }
  function restartAutoplay(){
    startAutoplay();
  }

  const stageCardEl = document.querySelector('.stage-card');
  stageCardEl.addEventListener('mouseenter', stopAutoplay);
  stageCardEl.addEventListener('mouseleave', startAutoplay);

  renderTabs();
  renderPhases();
  renderNote();
  renderStage();
  startAutoplay();
</script>

</body>
</html>
